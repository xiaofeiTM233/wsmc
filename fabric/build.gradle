plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.5'
	id 'maven-publish'
}

apply from: '../common.gradle'

loom {
	mods {
		"${project.archives_base_name}" {
			sourceSet sourceSets.main
		}
	}

	// runs.configureEach { vmArgs("-Dwsmc.debug=true") }
}

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// javax.annotation.Nullable
	implementation 'com.google.code.findbugs:jsr305:3.0.1'

	// Netty's http and websocket support
	include(implementation(group: 'io.netty', name: 'netty-codec-http', version: project.netty_version))
}


base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.dev_group

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand project.mergedProperties
	}
}

// configure the source folders
sourceSets {
    main {
        java {
            srcDir "../src/main/java"
        }
        resources {
            srcDir "../src/main/resources"
            srcDir "../src/generated/resources"
            exclude '.cache'
            exclude 'Thumbs.db'
        }
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"

	// Minecraft 26.1 and upwards uses Java 25.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	archiveClassifier.set("fabric-${project.minecraft_version}")

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	manifest {
		attributes('Implementation-Timestamp': new Date().toString())
	}
}
